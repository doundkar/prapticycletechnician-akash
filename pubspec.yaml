name: bicycle_app_technician
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dotted_border: ^3.1.0
  get: ^4.7.3
  pinput: ^6.0.2
  flutter_phone_direct_caller: ^2.1.1
  permission_handler: ^11.3.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.1
  share_plus: ^12.0.1
  table_calendar: ^3.0.9
  http: ^1.6.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  number_to_words: ^1.0.0
  lottie: ^3.3.2
  email_validator: ^3.0.0
  validate_phone_number: ^1.1.1
  url_launcher: ^6.2.4
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"

  # Optional (recommended for Android modern icons)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"
